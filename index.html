<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Akshar Paaul Attendance</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fbf7ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Akshar Paaul">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Applied before first paint so a saved preference doesn't flash the wrong
  // theme for a moment. When nothing is saved, the CSS media query handles it
  // based on the device's own light/dark setting.
  (function(){
    try{
      var saved = localStorage.getItem('ap_theme');
      if(saved==='light' || saved==='dark'){ document.documentElement.setAttribute('data-theme', saved); }
    }catch(e){}
  })();
</script>
<style>
  /* Palette sampled directly from the Akshar Paaul logo (dancing children in
     brand blue + magenta, the bilingual अ/A open book, its sage-cream pages
     and warm brown page-edge) — deepened a touch from the raw logo hex values
     where needed to clear AA contrast on a plain background. */
  :root{
    --bg:#fbf7ec;
    --surface:#ffffff;
    --surface-2:#eef3d6;
    --ink:#221e1a;
    --ink-soft:#6b6152;
    --ink-faint:#978d79;
    --border:#e4dcc6;
    --primary:#186a8d;
    --primary-ink:#ffffff;
    --primary-soft:#e1eef3;
    --primary-soft-ink:#0f4459;
    --accent:#c11060;
    --accent-soft:#fbe3ee;
    --accent-soft-ink:#870b43;
    --brand-brown:#8a4e28;
    --present:#2f7d3f;
    --present-soft:#e3f3e5;
    --absent:#b8463d;
    --absent-soft:#fbe7e5;
    --unmarked:#9a9284;
    --shadow: 0 1px 2px rgba(34,30,26,.07), 0 4px 14px rgba(34,30,26,.07);
    --radius: 14px;
    --radius-sm: 9px;
    --radius-btn: 10px;
    --font-display: 'Baloo 2', 'Segoe UI Rounded', system-ui, sans-serif;
    --font-body: 'Hind', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181a;
      --surface:#1a2022;
      --surface-2:#222a1e;
      --ink:#ede7d8;
      --ink-soft:#aca290;
      --ink-faint:#726b5c;
      --border:#2c332e;
      --primary:#5db3dd;
      --primary-ink:#0b2634;
      --primary-soft:#1c333d;
      --primary-soft-ink:#93d3f0;
      --accent:#f56aa5;
      --accent-soft:#3d1f2c;
      --accent-soft-ink:#f8a3c6;
      --brand-brown:#c99461;
      --present:#5cbb78;
      --present-soft:#1c3323;
      --absent:#e08078;
      --absent-soft:#3a2220;
      --unmarked:#7c8479;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181a;
    --surface:#1a2022;
    --surface-2:#222a1e;
    --ink:#ede7d8;
    --ink-soft:#aca290;
    --ink-faint:#726b5c;
    --border:#2c332e;
    --primary:#5db3dd;
    --primary-ink:#0b2634;
    --primary-soft:#1c333d;
    --primary-soft-ink:#93d3f0;
    --accent:#f56aa5;
    --accent-soft:#3d1f2c;
    --accent-soft-ink:#f8a3c6;
    --brand-brown:#c99461;
    --present:#5cbb78;
    --present-soft:#1c3323;
    --absent:#e08078;
    --absent-soft:#3a2220;
    --unmarked:#7c8479;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse 1000px 480px at 50% -12%, var(--surface-2) 0%, var(--bg) 55%);
    background-repeat:no-repeat;
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  a{color:var(--primary);}
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  ::selection{background:var(--primary-soft);}

  .icon{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex-shrink:0;
    stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .icon-lg{width:1.5em;height:1.5em;}

  .avatar{
    width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:.76rem;flex-shrink:0;color:#fff;
    letter-spacing:.2px;vertical-align:middle;
  }
  .avatar.sm{width:24px;height:24px;font-size:.62rem;margin-right:8px;}
  img.avatar.photo{object-fit:cover;background:var(--surface-2);}
  .photo-picker{display:flex;align-items:center;gap:10px;}
  .photo-picker .avatar, .photo-picker .avatar.photo{width:52px;height:52px;font-size:1rem;}
  .photo-picker input[type=file]{display:none;}

  .wrap{max-width:1040px;margin:0 auto;padding:0 16px;}

  header.top{
    background:var(--surface);
    border-bottom:3px solid transparent;
    border-image:linear-gradient(90deg, var(--primary), var(--accent)) 1;
    position:sticky;top:0;z-index:20;
    overflow:hidden;
  }
  .brand-watermark{position:absolute;inset:0;opacity:.09;pointer-events:none;z-index:0;}
  .brand-watermark svg{width:100%;height:100%;display:block;}
  /* padding-right reserves room for the fixed theme/language toolbar docked in
     the corner — the toolbar sits at a fixed distance from the viewport's own
     right edge (not the centered .wrap's edge), so without this the header's
     title or stat pills run underneath it at almost any viewport width up to
     roughly 1250px, not just on a narrow phone. */
  .top-inner{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 106px 14px 16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-emblem{height:34px;width:auto;flex-shrink:0;}
  .brand h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.38rem;
    margin:0;
    letter-spacing:.1px;
    text-wrap:balance;
  }
  .brand p{margin:1px 0 0;color:var(--ink-soft);font-size:.83rem;}
  .stat-pill{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:999px;padding:5px 12px;font-size:.78rem;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .stat-row{display:flex;gap:8px;flex-wrap:wrap;}

  nav.tabs{position:relative;z-index:1;display:flex;gap:4px;padding:0 16px;max-width:1040px;margin:0 auto;overflow-x:auto;}
  nav.tabs button{
    appearance:none;border:none;background:none;cursor:pointer;
    padding:11px 14px;font-size:.92rem;font-weight:600;color:var(--ink-soft);
    border-bottom:2.5px solid transparent;white-space:nowrap;
  }
  nav.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);}
  nav.tabs button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--primary);outline-offset:2px;
  }

  main{padding:18px 0 40px;}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px;
  }
  .section-title{
    font-family:var(--font-display);font-weight:700;font-size:1.1rem;margin:0 0 12px;
    padding-bottom:8px;border-bottom:2px solid var(--surface-2);
  }
  .controls-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%;flex:1 1 150px;}
  .field label{display:flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .field label .icon{width:.95em;height:.95em;}
  select,input[type=text],input[type=date],input[type=search],input[type=tel],input[type=number],input[type=password]{
    border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;
    background:var(--surface);color:var(--ink);font-size:.9rem;min-height:38px;
    width:100%;max-width:100%;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .btn{
    appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:var(--radius-btn);padding:8px 16px;font-size:.85rem;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:var(--primary);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);}
  .btn.primary:hover{filter:brightness(1.05);}
  .btn.ghost{border-color:transparent;background:transparent;}
  .btn.danger{border-color:var(--absent);color:var(--absent);}
  .btn.danger:hover{background:var(--absent-soft);}
  .stat-pill.link{border:none;cursor:pointer;font-family:inherit;}
  .stat-pill.link:hover{filter:brightness(.96);}
  .btn.small{padding:5px 11px;font-size:.78rem;}
  .btn:disabled{opacity:.45;cursor:default;}

  .banner{
    display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--accent-soft-ink);
    border:1px solid var(--accent-soft-ink);border-color:color-mix(in srgb, var(--accent-soft-ink) 25%, transparent);
    border-radius:var(--radius-sm);padding:10px 14px;font-size:.85rem;margin-bottom:14px;
  }
  .banner button{margin-left:auto;}

  .roster-list{display:flex;flex-direction:column;gap:8px;}
  .class-group-header{
    font-family:var(--font-display);font-size:.82rem;font-weight:600;letter-spacing:.02em;
    color:var(--ink-soft);margin:14px 0 2px;padding-bottom:4px;border-bottom:1px solid var(--border);
  }
  .class-group-header:first-child{margin-top:0;}
  .stu-row{position:relative;border-radius:var(--radius-sm);}
  .stu-row-inner{
    position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);
    border-radius:var(--radius-sm);background:var(--surface);touch-action:pan-y;
  }
  .swipe-reveal{
    position:absolute;inset:0;border-radius:var(--radius-sm);opacity:0;pointer-events:none;
  }
  .swipe-reveal .icon-wrap{
    position:absolute;inset:0;display:flex;align-items:center;opacity:0;color:#fff;
  }
  .swipe-reveal .icon-wrap.check{justify-content:flex-start;padding-left:22px;}
  .swipe-reveal .icon-wrap.cross{justify-content:flex-end;padding-right:22px;}
  .stu-row.swiping-present .swipe-reveal{opacity:1;background:var(--present);}
  .stu-row.swiping-present .swipe-reveal .icon-wrap.check{opacity:1;}
  .stu-row.swiping-absent .swipe-reveal{opacity:1;background:var(--absent);}
  .stu-row.swiping-absent .swipe-reveal .icon-wrap.cross{opacity:1;}
  .stu-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;}
  .stu-text{min-width:0;}
  .stu-name{font-weight:600;font-size:.94rem;}
  .stu-sub{font-size:.78rem;color:var(--ink-soft);margin-top:1px;}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;}
  .chip.review{background:var(--accent-soft);color:var(--accent-soft-ink);}
  .chip.streak{background:var(--absent-soft);color:var(--absent);}
  .chip.streak .icon{width:.85em;height:.85em;}

  .reason-row{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px 56px;}
  .reason-chip{
    appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
    border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .reason-chip:hover{border-color:var(--accent);}
  .reason-chip.on{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:var(--accent-soft-ink);}
  @media (min-width: 720px){ .reason-row{padding-left:60px;} }

  .mark-toggle{display:flex;flex-shrink:0;border:1.5px solid var(--border);border-radius:999px;overflow:hidden;}
  .mark-seg{
    border:none;background:var(--surface);color:var(--ink-faint);cursor:pointer;
    width:42px;height:38px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;
  }
  .mark-seg+.mark-seg{border-left:1.5px solid var(--border);}
  .mark-seg.present.on{background:var(--present-soft);color:var(--present);}
  .mark-seg.absent.on{background:var(--absent-soft);color:var(--absent);}
  .mark-seg.just-set{animation:markPop .32s ease;}
  .mark-seg.present.just-set .icon{stroke-dasharray:22;stroke-dashoffset:22;animation:drawCheck .32s ease .02s forwards;}
  @keyframes markPop{ 0%{transform:scale(1);} 40%{transform:scale(1.22);} 100%{transform:scale(1);} }
  @keyframes drawCheck{ to{stroke-dashoffset:0;} }
  @media (prefers-reduced-motion: reduce){
    .mark-seg.just-set{animation:none;}
    .mark-seg.present.just-set .icon{animation:none;stroke-dashoffset:0;}
  }

  .mark-progress{display:flex;align-items:center;gap:12px;}
  .progress-ring{flex-shrink:0;}
  .progress-ring .ring-bg{fill:none;stroke:var(--surface-2);stroke-width:5;}
  .progress-ring .ring-fg{fill:none;stroke:var(--present);stroke-width:5;stroke-linecap:round;
    transition:stroke-dashoffset .45s ease;}
  .mark-progress-text{display:flex;flex-direction:column;line-height:1.25;}
  .mark-progress-text .n{font-family:var(--font-display);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;}
  .mark-progress-text .lbl{font-size:.76rem;color:var(--ink-soft);}

  .save-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--surface);border-top:1px solid var(--border);
    box-shadow:0 -4px 16px rgba(0,0,0,.08);
    padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:12px;
    transform:translateY(110%);transition:transform .18s ease;
  }
  .save-bar.show{transform:translateY(0);}
  .save-bar .msg{font-size:.85rem;color:var(--ink-soft);}
  .save-bar .msg b{color:var(--ink);font-variant-numeric:tabular-nums;}

  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);
     padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm);}
  .table-scroll table{min-width:760px;}
  .name-cell{font-weight:600;}
  .editable{border-bottom:1.5px dashed var(--ink-faint);cursor:text;padding:1px 2px;border-radius:3px;}
  .editable:hover{background:var(--surface-2);}
  .editable.missing{color:var(--accent-soft-ink);font-style:italic;}
  .locked-field{display:inline-flex;align-items:center;gap:5px;color:var(--ink-faint);font-style:italic;}
  .locked-field .icon{width:.85em;height:.85em;}
  .pct{font-variant-numeric:tabular-nums;font-weight:700;}
  .pct.low{color:var(--absent);}
  .pct.mid{color:var(--accent);}
  .pct.high{color:var(--present);}
  .sparkline{display:block;flex-shrink:0;}
  .sparkline rect{transition:height .2s ease, y .2s ease;}

  .centre-compare{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .compare-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;align-items:center;gap:10px;font-size:.82rem;}
  .compare-label{color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .compare-bar{background:var(--surface-2);border-radius:999px;height:9px;overflow:hidden;}
  .compare-fill{display:block;height:100%;border-radius:999px;background:var(--present);}
  .compare-fill.mid{background:var(--accent);}
  .compare-fill.low{background:var(--absent);}
  .compare-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:16px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;}
  .stat-card .num{font-family:var(--font-display);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums;}
  .stat-card .lbl{font-size:.78rem;color:var(--ink-soft);margin-top:2px;}

  .detail-panel{margin-top:8px;padding:12px;border-top:1px dashed var(--border);display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 16px;}
  .detail-item label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:3px;}

  .empty-state{text-align:center;padding:40px 16px;color:var(--ink-soft);}
  .empty-state .icon{width:2.2rem;height:2.2rem;color:var(--ink-faint);margin-bottom:10px;stroke-width:1.5;}
  .empty-state .title{font-family:var(--font-display);font-weight:600;color:var(--ink);font-size:1rem;margin-bottom:3px;}
  .empty-state .sub{font-size:.84rem;max-width:320px;margin:0 auto;line-height:1.5;}
  .toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-12px);
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.85rem;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:50;
    box-shadow:var(--shadow);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .undo-toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-12px);
    background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:999px;font-size:.85rem;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:51;
    box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);
  }
  .undo-toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .undo-toast button{
    appearance:none;border:none;background:var(--primary);color:var(--primary-ink);
    border-radius:999px;padding:6px 14px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;
    flex-shrink:0;
  }

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  @media (min-width: 720px){
    .stu-row{padding:12px 16px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }

  /* ---- sign-in gate ---- */
  #gate-screen[hidden]{display:none;}
  .gate-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;
    background:radial-gradient(ellipse 900px 500px at 50% -10%, var(--surface-2) 0%, var(--bg) 65%);
  }
  .gate-card{max-width:440px;width:100%;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px 26px;text-align:center;}
  .gate-emblem{height:76px;width:auto;margin:0 auto 14px;display:block;}
  .gate-card h1{font-family:var(--font-display);font-weight:700;font-size:1.44rem;margin:0 0 4px;text-wrap:balance;}
  .gate-card > p.lead{color:var(--ink-soft);font-size:.88rem;margin:0 0 20px;}
  .gate-card .gate-form, .gate-card .gate-list, .gate-card .gate-note{text-align:left;}
  .gate-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .gate-option{
    display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;
    width:100%;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);
    padding:11px 14px;cursor:pointer;font-family:inherit;
  }
  .gate-option:hover{border-color:var(--primary);background:var(--primary-soft);}
  .gate-option .nm{font-weight:600;font-size:.92rem;}
  .gate-option .ct{font-size:.76rem;color:var(--ink-soft);}
  .gate-divider{display:flex;align-items:center;gap:10px;color:var(--ink-faint);font-size:.72rem;
    text-transform:uppercase;letter-spacing:.05em;margin:16px 0;}
  .gate-divider::before,.gate-divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .gate-form{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .gate-note{font-size:.76rem;color:var(--ink-faint);margin-top:18px;line-height:1.5;}
  .gate-note code{background:var(--surface-2);border-radius:4px;padding:1px 5px;font-size:.85em;}
  .link-btn{background:none;border:none;padding:0;color:var(--primary);font-size:.85rem;
    font-weight:600;cursor:pointer;text-decoration:underline;font-family:inherit;}

  .signedin-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--primary-soft);
    color:var(--primary-soft-ink);font-size:.8rem;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .signedin-bar b{font-weight:700;}
  .signedin-bar .link-btn{color:var(--primary-soft-ink);}
  .sync-banner{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--accent-soft);
    color:var(--accent-soft-ink);font-size:.8rem;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .sync-banner[hidden]{display:none;}
  .sync-banner .btn{margin-left:auto;}
  .locked-value{border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;
    background:var(--surface-2);font-size:.9rem;min-height:38px;display:flex;align-items:center;}

  #corner-toolbar{
    position:fixed;top:14px;right:14px;z-index:40;display:flex;gap:8px;
  }
  .theme-toggle{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
    padding:0;transition:transform .15s ease, color .15s ease, border-color .15s ease;
    font-family:inherit;
  }
  .theme-toggle:hover{color:var(--primary);border-color:var(--primary);}
  .theme-toggle:active{transform:scale(.92);}
  .theme-toggle .icon{width:1.15em;height:1.15em;}
  .theme-toggle .icon-moon{display:none;}
  .lang-toggle{font-size:.7rem;font-weight:700;letter-spacing:.02em;}
  :root[data-theme="dark"] .theme-toggle .icon-sun{display:none;}
  :root[data-theme="dark"] .theme-toggle .icon-moon{display:block;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .theme-toggle .icon-sun{display:none;}
    :root:not([data-theme="light"]) .theme-toggle .icon-moon{display:block;}
  }

  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,16,10,.5);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:1000;
  }
  .modal-overlay[hidden]{display:none;}
  .modal-card{
    background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:22px;max-width:420px;width:100%;
  }
  .modal-card.modal-wide{max-width:640px;}
  .modal-card h3{font-family:var(--font-display);margin:0 0 8px;font-size:1.1rem;}
  .modal-card p{margin:0 0 16px;color:var(--ink-soft);font-size:.88rem;line-height:1.5;}
  .modal-card input[type=text]{margin-bottom:16px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}

  th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
  th.sortable:hover{color:var(--primary);}
  th.sortable .arrow{display:inline-block;margin-left:3px;opacity:.5;font-size:.75em;}
  th.sortable.active .arrow{opacity:1;}

  /* ---- quick search ---- */
  #qs-input{margin-bottom:10px;}
  .qs-results{display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow-y:auto;}
  .qs-result{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    border:none;background:none;border-radius:var(--radius-sm);padding:8px;cursor:pointer;font-family:inherit;
  }
  .qs-result:hover, .qs-result:focus-visible{background:var(--surface-2);}
  .qs-name{display:block;font-weight:600;font-size:.9rem;}
  .qs-sub{display:block;font-size:.76rem;color:var(--ink-soft);}

  /* ---- bulk selection (Students tab) ---- */
  .bulk-toolbar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--primary-soft);color:var(--primary-soft-ink);
    border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:12px;font-size:.85rem;
  }
  .bulk-toolbar b{font-variant-numeric:tabular-nums;}
  .bulk-toolbar .btn{margin-left:0;}
  td.select-cell, th.select-cell{width:34px;text-align:center;}

  /* ---- weekly digest ---- */
  .digest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:6px;}
  .digest-item{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface);}
  .digest-item .digest-num{font-family:var(--font-display);font-weight:700;font-size:1.15rem;}
  .digest-item .digest-lbl{font-size:.78rem;color:var(--ink-soft);}
  .reason-tally{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .reason-tally .chip{background:var(--surface-2);color:var(--ink-soft);text-transform:none;letter-spacing:0;}

  /* ---- monthly / term trend chart ---- */
  .trend-scroll{overflow-x:auto;padding-bottom:4px;margin-bottom:16px;}
  .trend-chart{display:flex;align-items:flex-end;gap:10px;height:120px;min-width:min-content;padding:4px 2px 0;}
  .trend-bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex-shrink:0;width:34px;gap:4px;}
  .trend-bar-track{width:16px;height:88px;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .trend-bar-fill{width:100%;border-radius:6px 6px 0 0;background:var(--present);min-height:2px;}
  .trend-bar-fill.mid{background:var(--accent);}
  .trend-bar-fill.low{background:var(--absent);}
  .trend-bar-pct{font-size:.68rem;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .trend-bar-lbl{font-size:.68rem;color:var(--ink-faint);white-space:nowrap;}

  /* ---- teacher personal stats ---- */
  .month-compare{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .month-compare .stat-card{flex:1 1 180px;}
  .month-delta{font-size:.8rem;font-weight:700;margin-top:2px;}
  .month-delta.up{color:var(--present);}
  .month-delta.down{color:var(--absent);}
  .month-delta.flat{color:var(--ink-faint);}

  /* ---- per-student attendance calendar (Students detail panel) ---- */
  .cal-wrap{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;align-items:flex-start;}
  .cal-month{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;}
  .cal-month-lbl{font-family:var(--font-display);font-weight:700;font-size:.78rem;margin-bottom:6px;text-align:center;}
  .cal-dow{display:grid;grid-template-columns:repeat(7,18px);gap:3px;margin-bottom:3px;}
  .cal-dow span{font-size:.58rem;color:var(--ink-faint);text-align:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,18px);grid-auto-rows:18px;gap:3px;}
  .cal-cell{display:flex;align-items:center;justify-content:center;font-size:.6rem;border-radius:4px;color:var(--ink-faint);background:var(--surface-2);}
  .cal-cell.empty{background:transparent;}
  .cal-cell.present{background:var(--present);color:#fff;}
  .cal-cell.absent{background:var(--absent);color:#fff;}
  .cal-cell.unmarked{background:var(--surface-2);color:var(--ink-faint);}
  .cal-legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:.72rem;color:var(--ink-soft);align-self:center;}
  .cal-legend span{display:inline-flex;align-items:center;gap:4px;}
  .cal-legend i{display:inline-block;border-radius:3px;}

  function isTypingTarget(el){

  // ================= TAB: MARK ATTENDANCE =================
  // stdTouched tracks whether the person has actually used the Class dropdown
  // yet (picked a specific class, or deliberately chosen "All classes"). Until
  // then, renderMark() defaults std to the centre's first class so a teacher
  // lands on one class's roster instead of every class merged together — the
  // combined view is still one dropdown pick away, never removed.
  var markFilters = { centre: '', date: nearestSunday(), std: '', stdTouched: false };

  function resubscribeMark(){
    if(markUnsub){ markUnsub(); markUnsub = null; }
    if(!markFilters.centre) return;
    var col = collection(db, 'attendance');
    var q = query(col, where('centre','==', markFilters.centre), where('date','==', markFilters.date));
    markUnsub = onSnapshot(q, function(snap){
      snap.forEach(function(docSnap){ mergeAttendanceDoc(docSnap.data()); });
      renderMark();
    }, function(err){
      showToast(t('err_load_attendance'));
    });
  }

  // Shared by the tap toggle and the swipe gesture below, so both paths write
  // through the same offline-safe persistWrite() call.
  var lastMarkAction = null;
  async function setMark(sid, act){
    var student = studentsById()[sid];
    if(!student) return;
    var cur = attVal(sid, markFilters.date);
    var newVal = act==='present' ? 1 : 0;
    var docId = sid+'_'+markFilters.date;
    var item, resultVal;
    if(cur === newVal){
      clearAttendanceEntry(sid, markFilters.date);
      item = {type:'delete', col:'attendance', docId:docId};
      resultVal = null;
    } else {
      var data = {studentId:sid, centre:student.centre, date:markFilters.date, v:newVal, by:IDENTITY.name, at:new Date().toISOString()};
      mergeAttendanceDoc(data);
      item = {type:'set', col:'attendance', docId:docId, data:data};
      resultVal = newVal;
    }
    lastMarkAction = {sid:sid, val:resultVal};
    renderMark();
    var ok = await persistWrite(item);
    if(!ok) showToast(t('saved_offline'));
  }
  // Attaches an optional reason to an *existing* absence without disturbing
  // fast marking — tapping present/absent never blocks on this. Tapping the
  // same reason chip again clears it.
  async function setAbsenceReason(sid, date, reason){
    var student = studentsById()[sid];
    var existing = attEntry(sid, date);
    if(!student || existing===undefined) return;
    var curVal = (typeof existing==='object') ? existing.v : existing;
    if(curVal !== 0) return;
    var curReason = (typeof existing==='object') ? existing.reason : null;
    var nextReason = (curReason===reason) ? null : reason;
    var data = {
      studentId: sid, centre: student.centre, date: date, v: 0,
      by: (typeof existing==='object' && existing.by) ? existing.by : IDENTITY.name,

  // A quick swipe left/right on a roster row marks absent/present without having
  // to land a tap on the small toggle — meant for the common case of working
  // down a long list one student at a time on a phone.
  function attachSwipe(rowEl, sid){
    var inner = rowEl.querySelector('.stu-row-inner');
    var THRESHOLD = 64;
    var dragging=false, decided=false, horizontal=false, startX=0, startY=0;
    function reset(){
      inner.style.transition = 'transform .2s ease';
      inner.style.transform = 'translateX(0)';
      rowEl.classList.remove('swiping-present','swiping-absent');
    }
    // Pointer capture is grabbed only once a horizontal drag is confirmed
    // (not on every pointerdown) so a plain tap on the toggle buttons keeps
    // dispatching a normal click instead of being swallowed by the row.
    var pointerId = null;
    rowEl.addEventListener('pointerdown', function(e){
      if(e.pointerType==='mouse' && e.button!==0) return;
      dragging=true; decided=false; horizontal=false;
      startX=e.clientX; startY=e.clientY;
      pointerId = e.pointerId;
      inner.style.transition='none';
    });
    rowEl.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var dx=e.clientX-startX, dy=e.clientY-startY;
      if(!decided){
        if(Math.abs(dx)<8 && Math.abs(dy)<8) return;
        decided=true; horizontal = Math.abs(dx)>Math.abs(dy);
        if(!horizontal){ dragging=false; return; }
        try{ rowEl.setPointerCapture(pointerId); }catch(err){}
      }
      if(!horizontal) return;
      e.preventDefault();
      var clamped = Math.max(-110, Math.min(110, dx));
      inner.style.transform = 'translateX('+clamped+'px)';
      rowEl.classList.toggle('swiping-present', clamped>28);
      rowEl.classList.toggle('swiping-absent', clamped<-28);
    });
    function finish(e){
      if(!dragging) return;
      dragging=false;
      var dx = e.clientX-startX;
      var committed = null;
      if(horizontal){
        if(dx>THRESHOLD) committed='present';
        else if(dx<-THRESHOLD) committed='absent';
      }
      reset();
      if(committed) setMark(sid, committed);
    }
    rowEl.addEventListener('pointerup', finish);
    rowEl.addEventListener('pointercancel', reset);
  }

  // ---------- CSV student import ----------
  // A small hand-rolled CSV reader (RFC4180-ish: quoted fields, "" for an
  // escaped quote, either \n or \r\n line endings) — no library needed for
  // something this scoped, consistent with the rest of the app.
  function parseCSV(text){
    var rows = []; var row = []; var field = ''; var inQuotes = false;
    for(var i=0;i<text.length;i++){
      var c = text[i];
      if(inQuotes){
        if(c==='"'){
          if(text[i+1]==='"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else { field += c; }
      } else {
        if(c==='"'){ inQuotes = true; }
        else if(c===','){ row.push(field); field=''; }
        else if(c==='\r'){ /* ignore, \n (or end) closes the row */ }
        else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return !(r.length===1 && r[0].trim()===''); });
  }

  function pctClass(pct){
    if(pct===null) return '';
    if(pct<50) return 'low';
    if(pct<80) return 'mid';
    return 'high';
  }

  function validateField(field, val){
    if(!val) return {ok:true};
    if(field==='age'){
      if(!/^\d{1,2}$/.test(val) || Number(val)<3 || Number(val)>25){
        return {ok:false, msg:t('age_invalid_msg')};
      }
    }
    if(field==='contact'){
      var digits = val.replace(/[^0-9]/g,'');
      if(digits.length<10 || digits.length>13){
        return {ok:false, msg:t('phone_invalid_msg')};
      }
    }
    return {ok:true};
  }
  // A record needs review when any of the four core fields are missing, or
  // when age/contact fail the light sanity check — used both when editing an
  // existing student and right when a new one is added.
  function computeNeedsReview(stu){
    var basicsOk = !!(stu.gender && stu.age && stu.medium && stu.teacher);
    var ageOk = validateField('age', stu.age||'').ok;
    var contactOk = validateField('contact', stu.contact||'').ok;
    return !basicsOk || !ageOk || !contactOk;
  }
  function genStudentId(){
    if(window.crypto && typeof window.crypto.randomUUID === 'function'){
      return 's_' + window.crypto.randomUUID();
    }
    // Fallback for the rare browser without crypto.randomUUID (older Safari/WebViews).
    return 's_' + Date.now().toString(16) + '_' + Math.random().toString(16).slice(2,10);
  }
  function genAuditId(){
    if(window.crypto && typeof window.crypto.randomUUID === 'function'){
      return 'a_' + window.crypto.randomUUID();
    }
    return 'a_' + Date.now().toString(16) + '_' + Math.random().toString(16).slice(2,10);
  }
  // A lightweight, append-only trail of who changed a student record and when —
  // separate from attendance, which already carries its own "by" per mark.
  // Best-effort: goes through the same offline queue as everything else, but a
  // failure here never blocks or rolls back the edit it's describing.
  function logAudit(action, studentId, studentName, details){
    var data = {
      action: action, studentId: studentId || null, studentName: studentName || null,
      by: (IDENTITY && IDENTITY.name) || 'unknown', byEmail: (IDENTITY && IDENTITY.email) || null,
      byRole: (IDENTITY && IDENTITY.role) || null, details: details || '', at: new Date().toISOString()
    };
    persistWrite({type:'set', col:'audit_log', docId:genAuditId(), data:data});
  }
  // Crops to a centered square and downsamples to a small JPEG data URL so a
  // student photo can live directly on the Firestore document (well under the
  // 1MB doc limit) without needing Firebase Storage or its own rules/billing.
  function resizeImageToDataUrl(file, size){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read failed')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('decode failed')); };
        img.onload = function(){
          var side = Math.min(img.width, img.height);
          var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
          var canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
          resolve(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ================= TAB: REPORTS =================
  var rpFilters = { std: '', sortKey:'attendance', sortDir:'asc' };
  var RP_COLUMNS = [['name','field_name'],['centre','field_centre'],['std','col_class'],['present','col_present'],['marked','col_marked'],['attendance','col_attendance']];
  function compareReportRows(a, b, key){
    if(key==='name') return a.s.name.localeCompare(b.s.name);
    if(key==='centre') return shortCentre(a.s.centre||'').localeCompare(shortCentre(b.s.centre||''));
    if(key==='std'){
      var ck = classSortKey(a.s.std)-classSortKey(b.s.std);
      return ck!==0 ? ck : a.s.name.localeCompare(b.s.name);
    }
    if(key==='present') return a.st.present - b.st.present;
    if(key==='marked') return a.st.total - b.st.total;
    var pa = a.st.pct===null ? 999 : a.st.pct;
    var pb = b.st.pct===null ? 999 : b.st.pct;
    return pa-pb;
  }
  // 'YYYY-MM' shifted back by `delta` whole months — used to line up "this
  // month" against "last month" for the teacher's personal stats card.
  function monthKeyOffset(monthKey, delta){
    var parts = monthKey.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1])-1 + delta, 1);
    return d.getFullYear()+'-'+pad2(d.getMonth()+1);
  }
  // Aggregate present/marked across every date in `monthPrefix` (e.g. "2026-08")
  // for the given roster — an aggregate rate rather than an average-of-averages,
  // so a centre with more students marked doesn't get drowned out by one with few.
  function computeMonthPct(roster, monthPrefix){
    var present = 0, total = 0;
    roster.forEach(function(s){
      Object.keys(studentAttendance(s.id)).forEach(function(d){
        if(d.indexOf(monthPrefix)!==0) return;
        total++;
        if(attVal(s.id, d)===1) present++;
      });
    });
    return { pct: total ? Math.round((present/total)*100) : null, total: total };
  }
  // One entry per calendar month that has any marked attendance at all, oldest
  // first — the raw material for the month-by-month / term-over-term trend chart.
  function computeMonthlyTrend(roster){
    var byMonth = {};
    roster.forEach(function(s){
      Object.keys(studentAttendance(s.id)).forEach(function(d){
        var m = d.slice(0,7);
        if(!byMonth[m]) byMonth[m] = {present:0, total:0};
        byMonth[m].total++;
        if(attVal(s.id, d)===1) byMonth[m].present++;
      });
    });
    return Object.keys(byMonth).sort().map(function(m){
      var b = byMonth[m];
      return { month: m, pct: b.total ? Math.round((b.present/b.total)*100) : null, total: b.total };
    });
  }
  function monthShortLabel(monthKey){
    var d = new Date(monthKey+'-01T00:00:00');
    return d.toLocaleDateString(undefined, {month:'short', year:'2-digit'});
  }
  // What "this week" looks like right now, for the digest card: how many of
  // each centre's students are still unmarked for the current session, plus a
  // tally of the absence reasons chosen so far — a quick "what needs a look"
  // view rather than something that requires digging through Mark attendance
  // centre by centre.
  function computeWeeklyDigest(roster){
    var weekDate = nearestSunday();
    var byCentre = {};
    roster.forEach(function(s){
      if(!byCentre[s.centre]) byCentre[s.centre] = {centre:s.centre, total:0, marked:0};
      byCentre[s.centre].total++;
      if(attEntry(s.id, weekDate) !== undefined) byCentre[s.centre].marked++;
    });
    var centreList = Object.keys(byCentre).map(function(c){ return byCentre[c]; })
      .sort(function(a,b){ return (b.total-b.marked) - (a.total-a.marked); });
    var reasonTally = {};
    roster.forEach(function(s){
      if(attVal(s.id, weekDate)===0){
        var r = attReason(s.id, weekDate) || 'unspecified';
        reasonTally[r] = (reasonTally[r]||0) + 1;
      }
    });
    return { weekDate: weekDate, centres: centreList, reasonTally: reasonTally };
  }
  function reasonTallyLabel(key){
    if(key==='unspecified') return 'No reason given';
    return absenceReasonLabel(key);
  }
  // Plain-text version of the centre summary for the current month, meant to be
  // pasted straight into WhatsApp/email/SMS — the no-backend stand-in for an
  // automated "email me this month's numbers" job.
  function buildMonthlySummaryText(centreRows, monthLabel, atRiskCount){
    var lines = [tf('summary_header', {month:monthLabel})];
    centreRows.forEach(function(r){
      lines.push(shortCentre(r.c)+': '+(r.pct===null?t('summary_no_records'):r.pct+'%')+' '+tf('summary_students_count', {n:r.total}));
    });
    if(atRiskCount>0){
      lines.push(tf('summary_atrisk_line', {n:atRiskCount, plural:pluralS(atRiskCount), threshold:STREAK_RISK_THRESHOLD}));
    }
    return lines.join('\n');
  }
  function copyTextToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject){
      try{
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('copy failed'));
      }catch(e){ reject(e); }
    });
  }
  function renderReports(){
    var el = document.getElementById('panel-reports');
    var activeRoster = STATE.roster.filter(isActive);
    var cList = centres();
    var rpClassList = classesIn(activeRoster);
    if(rpFilters.std && rpClassList.indexOf(rpFilters.std)===-1) rpFilters.std = '';
    var atRiskCount = activeRoster.filter(function(s){ return studentStats(s.id).streak >= STREAK_RISK_THRESHOLD; }).length;
    var html = '<div class="card">';

    // ---- weekly digest: what needs a look this week, at a glance ----
    var digest = computeWeeklyDigest(activeRoster);
    var unmarkedCentres = digest.centres.filter(function(c){ return c.total - c.marked > 0; });
    html += '<div class="controls-row" style="justify-content:space-between;"><h2 class="section-title" style="margin:0;">'+esc(t('weekly_digest_title'))+'</h2></div>';
    html += '<div class="digest-grid">';
    if(unmarkedCentres.length===0){
      html += '<div class="digest-item"><div class="digest-num" style="color:var(--present);">'+icon('check')+' '+esc(t('all_caught_up'))+'</div><div class="digest-lbl">'+esc(tf('everyone_marked_for', {date:fmtDateLabel(digest.weekDate)}))+'</div></div>';
    } else {
      unmarkedCentres.forEach(function(c){
        html += '<div class="digest-item"><div class="digest-num">'+esc(tf('n_unmarked', {n:c.total-c.marked}))+'</div><div class="digest-lbl">'+esc(tf('digest_progress', {centre:shortCentre(c.centre), marked:c.marked, total:c.total, date:fmtDateLabel(digest.weekDate)}))+'</div></div>';
      });
    }
    if(atRiskCount>0){
      html += '<div class="digest-item" style="border-color:var(--absent);"><div class="digest-num" style="color:var(--absent);">'+icon('alert')+' '+atRiskCount+'</div><div class="digest-lbl">'+esc(tf('students_with_streak', {plural:pluralS(atRiskCount), n:STREAK_RISK_THRESHOLD}))+'</div></div>';
    }
    html += '</div>';
    var reasonKeys = Object.keys(digest.reasonTally);
    if(reasonKeys.length){
      html += '<div class="reason-tally">';
      reasonKeys.forEach(function(k){
        html += '<span class="chip">'+esc(reasonTallyLabel(k))+': '+digest.reasonTally[k]+'</span>';
      });
      html += '</div>';
    }

    // ---- teacher's own centre: this month vs last month ----
    if(IDENTITY && IDENTITY.role==='teacher'){
      var thisMonthKey = todayIso().slice(0,7);
      var lastMonthKey = monthKeyOffset(thisMonthKey, -1);
      var thisMonthStat = computeMonthPct(activeRoster, thisMonthKey);
      var lastMonthStat = computeMonthPct(activeRoster, lastMonthKey);
      html += '<h2 class="section-title">'+esc(t('your_centre_month_title'))+'</h2>';
      html += '<div class="month-compare">';
      html += '<div class="stat-card"><div class="num">'+(thisMonthStat.pct===null?'—':thisMonthStat.pct+'%')+'</div><div class="lbl">'+esc(tf('this_month_label', {month:monthShortLabel(thisMonthKey)}))+'</div>';
      if(thisMonthStat.pct!==null && lastMonthStat.pct!==null){
        var delta = thisMonthStat.pct - lastMonthStat.pct;
        var deltaCls = delta>0 ? 'up' : (delta<0 ? 'down' : 'flat');
        html += '<div class="month-delta '+deltaCls+'">'+(delta>0?'▲ +':delta<0?'▼ ':'— ')+(delta===0?esc(t('no_change')):Math.abs(delta)+'%')+' '+esc(t('vs_last_month'))+'</div>';
      }
      html += '</div>';
      html += '<div class="stat-card"><div class="num">'+(lastMonthStat.pct===null?'—':lastMonthStat.pct+'%')+'</div><div class="lbl">'+esc(tf('last_month_label', {month:monthShortLabel(lastMonthKey)}))+'</div></div>';
      html += '</div>';
    }

    html += '<div class="controls-row" style="justify-content:space-between;">';
    html += '<h2 class="section-title" style="margin:0;">'+t('centre_summary')+'</h2>';
    html += '<span style="display:flex;gap:8px;flex-wrap:wrap;">';
    if(IDENTITY && IDENTITY.role==='coordinator'){
      html += '<button class="btn ghost small" id="rp-activity">'+icon('activity')+' '+t('activity_log')+'</button>';
      html += '<button class="btn ghost small" id="rp-backup">'+icon('archive')+' '+esc(t('backup_data_btn'))+'</button>';
    }
    html += '<button class="btn ghost small" id="rp-annual">'+icon('chart')+' '+esc(t('annual_report_btn'))+'</button>';
    html += '<button class="btn ghost small" id="rp-print">'+icon('print')+' '+t('print_register')+'</button>';
    html += '</span></div>';
    // Sorted lowest-attendance-first so the centre that most needs a look sits

  function csvCell(v){
    var str = String(v===null||v===undefined?'':v);
    if(str.indexOf(',')>-1 || str.indexOf('"')>-1 || str.indexOf('\n')>-1){ str = '"'+str.replace(/"/g,'""')+'"'; }
    return str;
  }
  function downloadCSV(lines, filename){
    var csv = lines.join('\n');
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    showToast(t('csv_downloaded_toast'));
  }
  function downloadJSON(obj, filename){
    var blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }
  // A full, coordinator-only export of everything in Firestore, as one JSON
  // file — a plain-language "disaster recovery" copy kept somewhere outside
  // Firebase. Needs no new rules: a coordinator can already read every
  // collection in full, this just does it for all four at once and saves the
  // result instead of rendering it.
  async function downloadFullBackup(){
    if(!(IDENTITY && IDENTITY.role==='coordinator')){ return; }
    showToast(t('backup_preparing_toast'));
    try{
      var collNames = ['teachers','students','attendance','audit_log'];
      var out = { exportedAt: new Date().toISOString(), exportedBy: IDENTITY.email };
      for(var i=0;i<collNames.length;i++){
        var name = collNames[i];
        var snap = await getDocs(collection(db, name));
        var docs = {};
        snap.forEach(function(d){ docs[d.id] = d.data(); });
        out[name] = docs;
      }
      var stamp = todayIso();
      downloadJSON(out, 'akshar-paaul-backup-'+stamp+'.json');
      showToast(t('backup_downloaded_toast'));
    }catch(e){
      showToast(t('backup_fail_toast'));
    }
  }
  // `rosterList` is optional — pass a subset (e.g. a Students-tab bulk
  // selection) to export just those students; omit it for the full active roster.
  function exportCSV(rosterList){
    // Mirrors the Details-panel redaction: a centre teacher's export shouldn't
    // hand over in bulk what the panel already hides one student at a time.
    var isTeacherViewer = !(IDENTITY && IDENTITY.role==='coordinator');
    var list = (rosterList && rosterList.length) ? rosterList : STATE.roster.filter(isActive);
    var header = ['Name','Centre','Teacher','Std','Gender','Age','Medium'];
    if(!isTeacherViewer) header.push('Contact');
    header = header.concat(['Funding Partner','Sessions Marked','Sessions Present','Attendance %','Needs Review','Status']);
    var lines = [header.join(',')];
    list.forEach(function(s){
      var st = studentStats(s.id);
      var row = [s.name, isTeacherViewer ? shortCentre(s.centre) : s.centre, s.teacher||'', s.std||'', s.gender||'', s.age||'', s.medium||''];
      if(!isTeacherViewer) row.push(s.contact||'');
      row = row.concat([s.funding_partner||'', st.total, st.present, st.pct===null?'':st.pct, s.needs_review?'Yes':'No', isActive(s)?'Active':'Archived']);
      lines.push(row.map(csvCell).join(','));
    });
    downloadCSV(lines, 'akshar-paaul-attendance.csv');
  }
  // Per-date grid: one column per session date, P/A/blank for each student —
  // for anyone who needs the raw day-by-day record rather than just the totals.
  // `monthPrefix` (e.g. "2026-08"), when given, limits the date columns to that
  // month instead of the student's whole history — used by the Reports tab's
  // one-tap "This month's CSV" shortcut.
  function exportDetailedCSV(students, monthPrefix){
    var list = students && students.length ? students : STATE.roster.filter(isActive);
    var dateSet = {};
    list.forEach(function(s){
      Object.keys(studentAttendance(s.id)).forEach(function(d){
        if(monthPrefix && d.indexOf(monthPrefix)!==0) return;
        dateSet[d] = true;
      });
    });
    var dates = Object.keys(dateSet).sort();
    if(!dates.length){
      showToast(monthPrefix ? t('nothing_to_export_month_toast') : t('nothing_to_export_list_toast'));
      return;
    }
    var isTeacherViewer = !(IDENTITY && IDENTITY.role==='coordinator');
    var header = ['Name','Centre','Teacher','Std'].concat(dates);
    var lines = [header.join(',')];
    list.forEach(function(s){
      var row = [s.name, isTeacherViewer ? shortCentre(s.centre) : s.centre, s.teacher||'', s.std||''];
      dates.forEach(function(d){
        var v = attVal(s.id, d);
        var reason = v===0 ? attReason(s.id, d) : null;
        row.push(v===1 ? 'P' : (v===0 ? ('A'+(reason?' ('+absenceReasonLabel(reason)+')':'')) : ''));
      });
      lines.push(row.map(csvCell).join(','));
    });
    downloadCSV(lines, monthPrefix ? 'akshar-paaul-attendance-'+monthPrefix+'.csv' : 'akshar-paaul-attendance-detailed.csv');
  }

  function friendlyAuthError(err){
    var code = err && err.code;
    if(code==='auth/invalid-credential' || code==='auth/wrong-password' || code==='auth/user-not-found'){

    if(code==='auth/too-many-requests'){ return t('auth_err_too_many'); }
    if(code==='auth/network-request-failed'){ return t('auth_err_offline'); }
    if(code==='auth/invalid-email'){ return t('auth_err_invalid_email'); }
    return t('auth_err_generic');
  }

  // ================= THEME TOGGLE =================
  function isDarkActive(){
    var attr = document.documentElement.getAttribute('data-theme');
    if(attr==='dark') return true;
    if(attr==='light') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  // The toggle floats in the top-right corner, but that corner isn't always
  // empty — the signed-in bar (with "Log out") and, occasionally, the offline
  // sync banner both sit up there too. Rather than guess a fixed offset that
  // breaks whenever one of those shows/hides/wraps, measure what's actually
  // on screen and dock just below it.
  function positionThemeToggle(){
    var toolbar = document.getElementById('corner-toolbar');
    if(!toolbar) return;
    var maxBottom = 0;
    ['signedin-bar','sync-banner'].forEach(function(id){
      var el = document.getElementById(id);
      if(!el) return;
      var r = el.getBoundingClientRect();
      if(r.height > 0 && r.bottom > maxBottom) maxBottom = r.bottom;
    });
    toolbar.style.top = (maxBottom > 0 ? maxBottom + 10 : 14) + 'px';
  }
  function initThemeToggle(){
    var btn = document.getElementById('theme-toggle');
    if(!btn) return;
    function refreshLabel(){
      var label = isDarkActive() ? t('dark_mode_switch_light') : t('dark_mode_switch_dark');
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
    }
    refreshLabel();
    btn.addEventListener('click', function(){
      var next = isDarkActive() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try{ localStorage.setItem('ap_theme', next); }catch(e){}
      refreshLabel();
    });
    positionThemeToggle();
    window.addEventListener('resize', positionThemeToggle);
    window._refreshThemeToggleLabel = refreshLabel;
  }
  initThemeToggle();

  // ================= OFFLINE QUEUE =================
  // Every write in this app goes through persistWrite(). It tries the real
  // Firestore write immediately; if that fails (no signal, dropped connection,
  // mid-save network hiccup) the write is queued in localStorage instead of
  // just failing, and retried automatically once the device is back online —
  // so marking attendance in a spot with patchy internet doesn't lose work.
  function loadPendingQueue(){
    try{ return JSON.parse(localStorage.getItem('ap_pending_writes') || '[]'); }
    catch(e){ return []; }
  }
  function savePendingQueue(){
    try{ localStorage.setItem('ap_pending_writes', JSON.stringify(PENDING_QUEUE)); }catch(e){}
  }
  function queueWrite(item){
    PENDING_QUEUE.push(item);
    savePendingQueue();
    updateSyncBanner();
  }
  async function execWrite(item){
    var ref = doc(db, item.col, item.docId);
    if(item.type==='set') await setDoc(ref, item.data);
    else if(item.type==='update') await updateDoc(ref, item.data);
    else if(item.type==='delete') await deleteDoc(ref);
  }
  // Applies the write immediately if possible; otherwise queues it for later
  // and returns false so the caller knows to tell the person it's pending.
  async function persistWrite(item){
    try{
      if(!navigator.onLine) throw new Error('offline');
      await execWrite(item);
      return true;
    }catch(e){
      queueWrite(item);
      return false;
    }
  }
  async function flushPendingQueue(){
    if(!PENDING_QUEUE.length || !navigator.onLine) return;
    var items = PENDING_QUEUE.slice();
    var stillPending = [];
    var synced = 0;
    for(var i=0;i<items.length;i++){
      try{ await execWrite(items[i]); synced++; }
      catch(e){ stillPending.push(items[i]); }
    }
    PENDING_QUEUE = stillPending;
    savePendingQueue();
    updateSyncBanner();
    if(synced>0) showToast(tf('changes_synced_toast', {n:synced, plural:pluralS(synced)}));
  }
  function updateSyncBanner(){
    var el = document.getElementById('sync-banner');
    if(!el) return;
    if(PENDING_QUEUE.length===0 && navigator.onLine){
      el.setAttribute('hidden','');
      positionThemeToggle();
      return;
    }
    el.removeAttribute('hidden');
    if(!navigator.onLine){
      el.innerHTML = '<span>'+icon('sync')+' '+esc(t('offline_msg'))+' '+(PENDING_QUEUE.length ? esc(tf('offline_pending_msg', {n:PENDING_QUEUE.length, plural:pluralS(PENDING_QUEUE.length)})) : esc(t('offline_no_pending_msg')))+'</span>';
    } else {
      el.innerHTML = '<span>'+icon('sync')+' '+esc(tf('pending_not_synced_msg', {n:PENDING_QUEUE.length, plural:pluralS(PENDING_QUEUE.length)}))+'</span><button class="btn ghost small" id="sync-retry-btn">'+esc(t('retry_now_btn'))+'</button>';
      var retryBtn = document.getElementById('sync-retry-btn');
      if(retryBtn) retryBtn.addEventListener('click', flushPendingQueue);
    }
    positionThemeToggle();
  }
  window.addEventListener('online', flushPendingQueue);
  window.addEventListener('offline', updateSyncBanner);
  setInterval(function(){ if(navigator.onLine) flushPendingQueue(); }, 30000);

  // ================= FIRESTORE DATA LAYER =================
  // NOTE: the one-time bulk-import (batchWriteAll/runFullSeed) has been
  // moved out of this shipped file — see local_seed_tool_DO_NOT_UPLOAD.html.
  // By the time this file is live, the database is already seeded, so this
  // build only ever reads/writes existing teachers/students/attendance docs.

  async function loadProfileAndEnter(user){
    try{
      var profileRef = doc(db,'teachers', user.email);
      var snap = await getDoc(profileRef);
      if(snap.exists()){
        var profile = snap.data();
        IDENTITY = {uid:user.uid, email:user.email, name:profile.name, centre:profile.centre||null, role:profile.role};
        await afterLogin();
        return;
      }
      showToast(t('account_not_setup_toast'));
      await signOut(auth);
    }catch(err){
      showToast(t('signin_fail_toast'));
      try{ await signOut(auth); }catch(e2){}
    }
  }

  function loadStudents(){
    return new Promise(function(resolve){
      var col = collection(db, 'students');
      var q = (IDENTITY.role==='teacher' && IDENTITY.centre) ? query(col, where('centre','==', IDENTITY.centre)) : col;
      if(studentsUnsub) studentsUnsub();
      var first = true;
      studentsUnsub = onSnapshot(q, function(snap){
        STATE.roster = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        if(first){ first=false; resolve(); }
        else if(!isEditingStudents()){
          renderHeader(); renderMark(); renderStudents(); renderReports();
        }
      }, function(err){ showToast(t('roster_load_fail_toast')); resolve(); });
    });
  }

  async function loadAttendanceHistory(force){
    if(ATTENDANCE_HISTORY_LOADED && !force) return;
    try{
      var col = collection(db, 'attendance');
      var q = (IDENTITY.role==='teacher' && IDENTITY.centre) ? query(col, where('centre','==', IDENTITY.centre)) : col;
      var snap = await getDocs(q);
      snap.forEach(function(docSnap){ mergeAttendanceDoc(docSnap.data()); });
      ATTENDANCE_HISTORY_LOADED = true;
      // The header's "at risk" pill depends on streaks computed from full
      // attendance history, which usually isn't in yet at the initial
      // showApp() render — refresh it here too, once the real numbers exist.
      renderHeader(); renderMark(); renderStudents(); renderReports();
    }catch(e){ showToast(t('attendance_history_fail_toast')); }
  }

  async function afterLogin(){
    await loadStudents();
    resubscribeMark();
    showApp();
    loadAttendanceHistory(false);
  }

  // ================= BOOT =================
  async function boot(){
    if(NEEDS_SETUP){ showGate(); return; }
    LOAD_FAILED = false;
    document.getElementById('gate-screen').innerHTML = '<div class="gate-card"><h1>'+esc(t('loading_ellipsis'))+'</h1></div>';
    document.getElementById('gate-screen').removeAttribute('hidden');
    document.getElementById('app-shell').setAttribute('hidden','');
    var base = "https://www.gstatic.com/firebasejs/" + FIREBASE_SDK_VERSION + "/";
    var appMod, authMod, fsMod;
    try{
      var mods = await Promise.all([
        import(base + "firebase-app.js"),
        import(base + "firebase-auth.js"),
        import(base + "firebase-firestore.js")
      ]);
      appMod = mods[0]; authMod = mods[1]; fsMod = mods[2];
    }catch(e){
      LOAD_FAILED = true;
      renderGate();
      return;
    }
    initializeApp = appMod.initializeApp;
    getAuth = authMod.getAuth; setPersistence = authMod.setPersistence;
    browserLocalPersistence = authMod.browserLocalPersistence; onAuthStateChanged = authMod.onAuthStateChanged;
    signInWithEmailAndPassword = authMod.signInWithEmailAndPassword; signOut = authMod.signOut;
    getFirestore = fsMod.getFirestore; doc = fsMod.doc; getDoc = fsMod.getDoc; setDoc = fsMod.setDoc;
    updateDoc = fsMod.updateDoc; deleteDoc = fsMod.deleteDoc; collection = fsMod.collection;
    getDocs = fsMod.getDocs; onSnapshot = fsMod.onSnapshot; writeBatch = fsMod.writeBatch;
    query = fsMod.query; where = fsMod.where; limit = fsMod.limit; orderBy = fsMod.orderBy;

    app = initializeApp(FIREBASE_CONFIG);
    auth = getAuth(app);
    db = getFirestore(app);
    try{ await setPersistence(auth, browserLocalPersistence); }catch(e){}
    showGate(); // Firebase is ready — onAuthStateChanged below will immediately
                // swap this for the app if a session is already remembered

    onAuthStateChanged(auth, function(user){
      if(user){
        loadProfileAndEnter(user);
      } else {
        if(studentsUnsub){ studentsUnsub(); studentsUnsub = null; }
        if(markUnsub){ markUnsub(); markUnsub = null; }
        STATE = { roster: [], attendance: {} };
        ATTENDANCE_HISTORY_LOADED = false;
        IDENTITY = null;
        showGate();
      }
    });
  }

  boot();
  </script>
</body>
</html>
