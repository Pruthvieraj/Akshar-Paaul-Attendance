<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Akshar Paaul Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7ef;
    --surface:#ffffff;
    --surface-2:#f2ede1;
    --ink:#232e28;
    --ink-soft:#5c6a61;
    --ink-faint:#8b9689;
    --border:#e1d9c6;
    --primary:#1f6f5c;
    --primary-ink:#ffffff;
    --primary-soft:#e3efe9;
    --primary-soft-ink:#155245;
    --accent:#d97e28;
    --accent-soft:#faead6;
    --accent-soft-ink:#8a4d10;
    --present:#2e7d46;
    --present-soft:#e3f3e6;
    --absent:#c0473f;
    --absent-soft:#fbe8e6;
    --unmarked:#9a9284;
    --shadow: 0 1px 2px rgba(35,46,40,.06), 0 4px 14px rgba(35,46,40,.06);
    --radius: 14px;
    --radius-sm: 9px;
    --font-display: 'Fraunces', Georgia, 'Iowan Old Style', serif;
    --font-body: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121613;
      --surface:#191f1a;
      --surface-2:#212822;
      --ink:#eae6da;
      --ink-soft:#a9b2a5;
      --ink-faint:#71796f;
      --border:#2c352d;
      --primary:#54c19e;
      --primary-ink:#0d1a15;
      --primary-soft:#1c332b;
      --primary-soft-ink:#8fdec1;
      --accent:#e6a75a;
      --accent-soft:#3a2c18;
      --accent-soft-ink:#f0c68e;
      --present:#5cbb78;
      --present-soft:#1c3323;
      --absent:#e08078;
      --absent-soft:#3a2220;
      --unmarked:#7c8479;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121613;
    --surface:#191f1a;
    --surface-2:#212822;
    --ink:#eae6da;
    --ink-soft:#a9b2a5;
    --ink-faint:#71796f;
    --border:#2c352d;
    --primary:#54c19e;
    --primary-ink:#0d1a15;
    --primary-soft:#1c332b;
    --primary-soft-ink:#8fdec1;
    --accent:#e6a75a;
    --accent-soft:#3a2c18;
    --accent-soft-ink:#f0c68e;
    --present:#5cbb78;
    --present-soft:#1c3323;
    --absent:#e08078;
    --absent-soft:#3a2220;
    --unmarked:#7c8479;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  a{color:var(--primary);}
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  ::selection{background:var(--primary-soft);}

  .wrap{max-width:1040px;margin:0 auto;padding:0 16px;}

  header.top{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:20;
  }
  .top-inner{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 16px 14px;flex-wrap:wrap;}
  .brand h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.5rem;
    margin:0;
    letter-spacing:.2px;
    text-wrap:balance;
  }
  .brand p{margin:2px 0 0;color:var(--ink-soft);font-size:.83rem;}
  .stat-pill{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:999px;padding:5px 12px;font-size:.78rem;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .stat-row{display:flex;gap:8px;flex-wrap:wrap;}

  nav.tabs{display:flex;gap:4px;padding:0 16px;max-width:1040px;margin:0 auto;overflow-x:auto;}
  nav.tabs button{
    appearance:none;border:none;background:none;cursor:pointer;
    padding:11px 14px;font-size:.92rem;font-weight:600;color:var(--ink-soft);
    border-bottom:2.5px solid transparent;white-space:nowrap;
  }
  nav.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);}
  nav.tabs button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--primary);outline-offset:2px;
  }

  main{padding:18px 0 40px;}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px;
  }
  .section-title{
    font-family:var(--font-display);font-weight:600;font-size:1.12rem;margin:0 0 12px;
  }
  .controls-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%;flex:1 1 150px;}
  .field label{font-size:.72rem;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  select,input[type=text],input[type=date],input[type=search],input[type=tel],input[type=number],input[type=password]{
    border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;
    background:var(--surface);color:var(--ink);font-size:.9rem;min-height:38px;
    width:100%;max-width:100%;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .btn{
    appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:999px;padding:8px 16px;font-size:.85rem;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:var(--primary);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);}
  .btn.primary:hover{filter:brightness(1.05);}
  .btn.ghost{border-color:transparent;background:transparent;}
  .btn.small{padding:5px 11px;font-size:.78rem;}
  .btn:disabled{opacity:.45;cursor:default;}

  .banner{
    display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--accent-soft-ink);
    border:1px solid var(--accent-soft-ink);border-color:color-mix(in srgb, var(--accent-soft-ink) 25%, transparent);
    border-radius:var(--radius-sm);padding:10px 14px;font-size:.85rem;margin-bottom:14px;
  }
  .banner button{margin-left:auto;}

  .roster-list{display:flex;flex-direction:column;gap:8px;}
  .class-group-header{
    font-family:var(--font-display);font-size:.82rem;font-weight:600;letter-spacing:.02em;
    color:var(--ink-soft);margin:14px 0 2px;padding-bottom:4px;border-bottom:1px solid var(--border);
  }
  .class-group-header:first-child{margin-top:0;}
  .stu-row{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);
    border-radius:var(--radius-sm);background:var(--surface);
  }
  .stu-main{flex:1;min-width:0;}
  .stu-name{font-weight:600;font-size:.94rem;}
  .stu-sub{font-size:.78rem;color:var(--ink-soft);margin-top:1px;}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;}
  .chip.review{background:var(--accent-soft);color:var(--accent-soft-ink);}
  .mark-toggle{display:flex;gap:6px;flex-shrink:0;}
  .mark-btn{
    border:1.5px solid var(--border);background:var(--surface);border-radius:999px;
    padding:8px 14px;font-size:.8rem;font-weight:700;cursor:pointer;min-width:76px;text-align:center;
  }
  .mark-btn.present.on{background:var(--present-soft);border-color:var(--present);color:var(--present);}
  .mark-btn.absent.on{background:var(--absent-soft);border-color:var(--absent);color:var(--absent);}

  .save-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--surface);border-top:1px solid var(--border);
    box-shadow:0 -4px 16px rgba(0,0,0,.08);
    padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:12px;
    transform:translateY(110%);transition:transform .18s ease;
  }
  .save-bar.show{transform:translateY(0);}
  .save-bar .msg{font-size:.85rem;color:var(--ink-soft);}
  .save-bar .msg b{color:var(--ink);font-variant-numeric:tabular-nums;}

  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);
     padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm);}
  .table-scroll table{min-width:760px;}
  .name-cell{font-weight:600;}
  .editable{border-bottom:1.5px dashed var(--ink-faint);cursor:text;padding:1px 2px;border-radius:3px;}
  .editable:hover{background:var(--surface-2);}
  .editable.missing{color:var(--accent-soft-ink);font-style:italic;}
  .pct{font-variant-numeric:tabular-nums;font-weight:700;}
  .pct.low{color:var(--absent);}
  .pct.mid{color:var(--accent);}
  .pct.high{color:var(--present);}
  .dots{display:flex;gap:3px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--unmarked);flex-shrink:0;}
  .dot.p{background:var(--present);}
  .dot.a{background:var(--absent);}

  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:16px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;}
  .stat-card .num{font-family:var(--font-display);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums;}
  .stat-card .lbl{font-size:.78rem;color:var(--ink-soft);margin-top:2px;}

  .detail-panel{margin-top:8px;padding:12px;border-top:1px dashed var(--border);display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 16px;}
  .detail-item label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:3px;}

  .empty-state{text-align:center;padding:40px 16px;color:var(--ink-soft);}
  .toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-12px);
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.85rem;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:50;
    box-shadow:var(--shadow);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  @media (min-width: 720px){
    .stu-row{padding:12px 16px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }

  /* ---- sign-in gate ---- */
  #gate-screen[hidden]{display:none;}
  .gate-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;}
  .gate-card{max-width:440px;width:100%;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 24px;}
  .gate-card h1{font-family:var(--font-display);font-weight:600;font-size:1.5rem;margin:0 0 4px;text-wrap:balance;}
  .gate-card > p.lead{color:var(--ink-soft);font-size:.88rem;margin:0 0 20px;}
  .gate-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .gate-option{
    display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;
    width:100%;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);
    padding:11px 14px;cursor:pointer;font-family:inherit;
  }
  .gate-option:hover{border-color:var(--primary);background:var(--primary-soft);}
  .gate-option .nm{font-weight:600;font-size:.92rem;}
  .gate-option .ct{font-size:.76rem;color:var(--ink-soft);}
  .gate-divider{display:flex;align-items:center;gap:10px;color:var(--ink-faint);font-size:.72rem;
    text-transform:uppercase;letter-spacing:.05em;margin:16px 0;}
  .gate-divider::before,.gate-divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .gate-form{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .gate-note{font-size:.76rem;color:var(--ink-faint);margin-top:18px;line-height:1.5;}
  .gate-note code{background:var(--surface-2);border-radius:4px;padding:1px 5px;font-size:.85em;}
  .link-btn{background:none;border:none;padding:0;color:var(--primary);font-size:.85rem;
    font-weight:600;cursor:pointer;text-decoration:underline;font-family:inherit;}

  .signedin-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--primary-soft);
    color:var(--primary-soft-ink);font-size:.8rem;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .signedin-bar b{font-weight:700;}
  .signedin-bar .link-btn{color:var(--primary-soft-ink);}
  .sync-banner{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--accent-soft);
    color:var(--accent-soft-ink);font-size:.8rem;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .sync-banner[hidden]{display:none;}
  .sync-banner .btn{margin-left:auto;}
  .locked-value{border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;
    background:var(--surface-2);font-size:.9rem;min-height:38px;display:flex;align-items:center;}
</style>
<body>
  <div id="gate-screen" class="gate-wrap"></div>

  <div id="app-shell" hidden>
    <div class="signedin-bar" id="signedin-bar"></div>
    <div class="sync-banner" id="sync-banner" hidden role="status" aria-live="polite"></div>
    <header class="top">
      <div class="wrap top-inner">
        <div class="brand">
          <h1>Akshar Paaul Attendance</h1>
          <p>Digital student attendance &amp; record register</p>
        </div>
        <div class="stat-row" id="header-stats"></div>
      </div>
      <nav class="tabs" id="tabs">
        <button data-tab="mark" class="active">Mark attendance</button>
        <button data-tab="students">Students &amp; records</button>
        <button data-tab="reports">Reports</button>
      </nav>
    </header>

    <main class="wrap">
      <section id="panel-mark" class="tab-panel active"></section>
      <section id="panel-students" class="tab-panel"></section>
      <section id="panel-reports" class="tab-panel"></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>


  <script type="module">
  // ============================================================
  // FIREBASE CONFIG — paste your project's web config here.
  // Firebase console → Project settings → General → Your apps → Web app → SDK setup.
  // These values are not secret; they identify the project, not grant access —
  // access is controlled by Firestore security rules + who has a login account.
  // ============================================================
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBUoHIH95mBqY_dR9ZRU7ZHHfiWeT_Ls54",
    authDomain: "akshar-paaul-attendance-d9417.firebaseapp.com",
    projectId: "akshar-paaul-attendance-d9417",
    storageBucket: "akshar-paaul-attendance-d9417.firebasestorage.app",
    messagingSenderId: "283165227415",
    appId: "1:283165227415:web:55122eb2eb7da6dcb7acd2"
  };

  // Login IDs that don't include "@" get this appended automatically, so teachers
  // can just type e.g. "aruna" instead of a full email address.
  const LOGIN_DOMAIN = "@akshar-paaul.app";

  // NOTE: the one-time student/attendance import and the teacher-directory
  // bootstrap used to live here. They've been moved to a local-only setup
  // file (never deployed) so this shipped file never contains any student
  // or teacher data, or import logic, in its page source. See
  // local_seed_tool_DO_NOT_UPLOAD.html if you ever need to reseed a fresh
  // database, or add new teachers directly in Firestore (Data → teachers
  // collection → Add document, id = their login email).

  const NEEDS_SETUP = FIREBASE_CONFIG.apiKey.indexOf("PASTE_") === 0;
  const FIREBASE_SDK_VERSION = "12.18.0";

  // Firebase is loaded with a dynamic import (not a static one) specifically so a
  // network hiccup or a blocked CDN shows a friendly retry message instead of a
  // silently blank page — a static "import ... from url" at the top of a module
  // can't be caught if the fetch fails.
  let app, auth, db;
  let initializeApp, getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged,
      signInWithEmailAndPassword, signOut;
  let getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
      collection, getDocs, onSnapshot, writeBatch, query, where, limit;

  // ---------- state ----------
  var STATE = { roster: [], attendance: {} };
  var IDENTITY = null;
  var studentsUnsub = null;
  var markUnsub = null;
  var ATTENDANCE_HISTORY_LOADED = false;
  var PENDING_QUEUE = loadPendingQueue();

  function studentsById(){
    var m = {};
    STATE.roster.forEach(function(s){ m[s.id] = s; });
    return m;
  }

  // ---------- helpers ----------
  function esc(s){
    if(s===null||s===undefined) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function uniqSorted(arr){
    return Array.from(new Set(arr.filter(Boolean))).sort(function(a,b){return a.localeCompare(b);});
  }
  function centres(){ return uniqSorted(STATE.roster.map(function(s){return s.centre;})); }
  function teachers(){ return uniqSorted(STATE.roster.map(function(s){return s.teacher;})); }
  function classSortKey(std){
    if(!std) return 999;
    var m = String(std).match(/\d+/);
    return m ? parseInt(m[0],10) : 998;
  }
  function classesIn(list){
    var seen = {};
    list.forEach(function(s){ if(s.std) seen[s.std] = true; });
    return Object.keys(seen).sort(function(a,b){ return classSortKey(a)-classSortKey(b); });
  }
  function shortCentre(c){
    if(!c) return c;
    var s = c;
    if(s.indexOf(' - ') > -1) s = s.split(' - ')[0].trim();
    else if(s.indexOf(',') > -1) s = s.split(',')[0].trim();
    return s.length>26 ? s.slice(0,26).trim()+'…' : s;
  }
  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function isoDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function nearestSunday(){
    var d = new Date();
    var day = d.getDay();
    d.setDate(d.getDate() - day);
    return isoDate(d);
  }
  var MARK_DATE_MIN = '2024-06-01';
  function todayIso(){ return isoDate(new Date()); }
  function clampMarkDate(iso){
    if(!iso) return nearestSunday();
    if(iso < MARK_DATE_MIN) return MARK_DATE_MIN;
    var max = todayIso();
    if(iso > max) return max;
    return iso;
  }
  function fmtDateLabel(iso){
    var d = new Date(iso+"T00:00:00");
    return d.toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short', year:'numeric'});
  }
  function studentAttendance(id){ return (STATE.attendance[id]) || {}; }
  function attEntry(sid, date){
    var rec = STATE.attendance[sid];
    return rec ? rec[date] : undefined;
  }
  function attVal(sid, date){
    var e = attEntry(sid, date);
    if(e === undefined) return undefined;
    return (typeof e === 'object') ? e.v : e;
  }
  function attBy(sid, date){
    var e = attEntry(sid, date);
    return (e && typeof e === 'object' && e.by) ? e.by : null;
  }
  function mergeAttendanceDoc(d){
    STATE.attendance[d.studentId] = STATE.attendance[d.studentId] || {};
    STATE.attendance[d.studentId][d.date] = {v:d.v, by:d.by||null, at:d.at||null};
  }
  function clearAttendanceEntry(sid, date){
    if(STATE.attendance[sid]) delete STATE.attendance[sid][date];
  }
  function studentStats(id){
    var rec = studentAttendance(id);
    var dates = Object.keys(rec);
    var total = dates.length;
    var present = dates.filter(function(d){return attVal(id,d)===1;}).length;
    var pct = total ? Math.round((present/total)*100) : null;
    return {total:total, present:present, pct:pct, dates:dates.sort()};
  }
  function showToast(text){
    var t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ t.classList.remove('show'); }, 2800);
  }
  function isEditingStudents(){
    var active = document.activeElement;
    return !!(active && active.closest && active.closest('#panel-students .editable'));
  }

  // ---------- header ----------
  function renderHeader(){
    var el = document.getElementById('header-stats');
    var needsReview = STATE.roster.filter(function(s){return s.needs_review;}).length;
    var parts = [];
    parts.push('<span class="stat-pill">'+STATE.roster.length+' students</span>');
    parts.push('<span class="stat-pill">'+centres().length+' centres</span>');
    if(needsReview>0){
      parts.push('<span class="stat-pill" style="border-color:var(--accent);color:var(--accent-soft-ink);background:var(--accent-soft);">'+needsReview+' need review</span>');
    }
    el.innerHTML = parts.join('');
  }

  // ================= TAB: MARK ATTENDANCE =================
  var markFilters = { centre: '', date: nearestSunday(), std: '' };

  function resubscribeMark(){
    if(markUnsub){ markUnsub(); markUnsub = null; }
    if(!markFilters.centre) return;
    var col = collection(db, 'attendance');
    var q = query(col, where('centre','==', markFilters.centre), where('date','==', markFilters.date));
    markUnsub = onSnapshot(q, function(snap){
      snap.forEach(function(docSnap){ mergeAttendanceDoc(docSnap.data()); });
      renderMark();
    }, function(err){
      showToast('Could not load attendance — check your connection.');
    });
  }

  function renderMark(){
    var el = document.getElementById('panel-mark');
    var cList = centres();
    var locked = IDENTITY && IDENTITY.role === 'teacher';
    if(locked){
      markFilters.centre = IDENTITY.centre;
    } else if(!markFilters.centre){
      markFilters.centre = cList[0] || '';
    }

    html += '<h2 class="section-title">Mark attendance</h2>';

      html += '<div class="field"><label>Centre</label><select id="mk-centre">';

        html += '<option value="'+esc(c)+'"'+(c===markFilters.centre?' selected':'')+'>'+esc(shortCentre(c))+'</option>';

    html += '<div class="controls-row" style="justify-content:space-between;">';

    html += '<span style="display:flex;gap:8px;">';

    html += '<button class="btn ghost small" id="mk-clear">Clear this date</button>';
    html += '</span></div>';

    html += '<div class="roster-list" id="mk-list">';
    if(list.length===0){
      html += '<div class="empty-state">No students found for this filter.</div>';
    }
    var lastGroupStd = null;
    var showGroups = !markFilters.std;
    list.forEach(function(s){
      if(showGroups && s.std !== lastGroupStd){
        lastGroupStd = s.std;
        html += '<div class="class-group-header">'+esc(s.std || 'No class on file')+'</div>';
      }
      var v = attVal(s.id, markFilters.date);
      var isP = v === 1, isA = v === 0;
      html += '<div class="stu-row" data-sid="'+s.id+'">';
      html += '<div class="stu-main"><div class="stu-name">'+esc(s.name)+'</div>';
      html += '<div class="stu-sub">'+esc(s.std||'—')+(s.teacher?' · '+esc(s.teacher):'')+'</div></div>';
      html += '<div class="mark-toggle">';
      html += '<button class="mark-btn present'+(isP?' on':'')+'" data-act="present">Present</button>';
      html += '<button class="mark-btn absent'+(isA?' on':'')+'" data-act="absent">Absent</button>';
      html += '</div></div>';
    });
    html += '</div></div>';

    el.innerHTML = html;

    if(!locked){
      document.getElementById('mk-centre').addEventListener('change', function(e){
        markFilters.centre = e.target.value; markFilters.std = ''; resubscribeMark();

    document.getElementById('mk-std').addEventListener('change', function(e){

    });
    document.getElementById('mk-date').addEventListener('change', function(e){
      markFilters.date = clampMarkDate(e.target.value); resubscribeMark();
    });
    document.getElementById('mk-today').addEventListener('click', function(){
      markFilters.date = nearestSunday(); resubscribeMark();
    });
    document.getElementById('mk-allpresent').addEventListener('click', async function(){
      var btn = this; btn.disabled = true;
      var now = new Date().toISOString();
      var items = list.map(function(s){
        return {type:'set', col:'attendance', docId:s.id+'_'+markFilters.date,
          data:{studentId:s.id, centre:s.centre, date:markFilters.date, v:1, by:IDENTITY.name, at:now}};
      });
      items.forEach(function(it){ mergeAttendanceDoc(it.data); });
      renderMark();
      var ok = true;
      try{
        if(!navigator.onLine) throw new Error('offline');
        var batch = writeBatch(db);
        items.forEach(function(it){ batch.set(doc(db, it.col, it.docId), it.data); });
        await batch.commit();
      }catch(e){
        ok = false;
        items.forEach(queueWrite);
      }
      showToast(ok ? 'Marked all present.' : 'Marked all present — saved on this device, will sync when back online.');
    });
    document.getElementById('mk-clear').addEventListener('click', async function(){
      var label = fmtDateLabel(markFilters.date)+(markFilters.std ? ' · '+markFilters.std : '');
      var confirmed = window.confirm('Clear every attendance mark for '+shortCentre(markFilters.centre)+' — '+label+'? This removes marks for '+list.length+' student'+(list.length===1?'':'s')+' and can\'t be undone.');
      if(!confirmed) return;
      var btn = this; btn.disabled = true;
      var items = list.map(function(s){
        return {type:'delete', col:'attendance', docId:s.id+'_'+markFilters.date, sid:s.id, date:markFilters.date};
      });
      items.forEach(function(it){ clearAttendanceEntry(it.sid, it.date); });
      renderMark();
      var ok = true;
      try{
        if(!navigator.onLine) throw new Error('offline');
        var batch = writeBatch(db);
        items.forEach(function(it){ batch.delete(doc(db, it.col, it.docId)); });
        await batch.commit();
      }catch(e){
        ok = false;
        items.forEach(queueWrite);
      }
      showToast(ok ? 'Cleared.' : 'Cleared on this device — will sync when back online.');
    });
    el.querySelectorAll('.mark-btn').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var row = btn.closest('.stu-row');
        var sid = row.getAttribute('data-sid');
        var student = studentsById()[sid];
        var act = btn.getAttribute('data-act');
        var cur = attVal(sid, markFilters.date);
        var newVal = act==='present' ? 1 : 0;
        var docId = sid+'_'+markFilters.date;
        var item;
        if(cur === newVal){
          clearAttendanceEntry(sid, markFilters.date);
          item = {type:'delete', col:'attendance', docId:docId};
        } else {
          var data = {studentId:sid, centre:student.centre, date:markFilters.date, v:newVal, by:IDENTITY.name, at:new Date().toISOString()};
          mergeAttendanceDoc(data);
          item = {type:'set', col:'attendance', docId:docId, data:data};
        }
        renderMark();
        var ok = await persistWrite(item);
        if(!ok) showToast('Saved on this device — will sync when back online.');

    });

  // ================= TAB: STUDENTS & RECORDS =================
  var stuFilters = { q:'', centre:'', teacher:'', std:'', reviewOnly:false, expanded:null };

  var EDIT_FIELDS = [
    ['name','Name'], ['centre','Centre'], ['teacher','Teacher'], ['std','Std / Class'],
    ['gender','Gender'], ['age','Age'], ['medium','Medium'], ['contact','Contact no.'],
    ['school','School name'], ['mother_edu',"Mother's education"], ['father_edu',"Father's education"],
    ['start_level','Starting level'], ['end_level','Ending level'], ['reading_level','Reading level'],
    ['school_time','School time'], ['funding_partner','Funding partner']
  ];

  function pctClass(pct){
    if(pct===null) return '';
    if(pct<50) return 'low';
    if(pct<80) return 'mid';
    return 'high';
  }

  function validateField(field, val){
    if(!val) return {ok:true};
    if(field==='age'){
      if(!/^\d{1,2}$/.test(val) || Number(val)<3 || Number(val)>25){
        return {ok:false, msg:'That doesn\'t look like a valid age — saved, but flagged for review.'};
      }
    }
    if(field==='contact'){
      var digits = val.replace(/[^0-9]/g,'');
      if(digits.length<10 || digits.length>13){
        return {ok:false, msg:'That doesn\'t look like a valid phone number — saved, but flagged for review.'};
      }
    }
    return {ok:true};
  }

    html += '<div class="field"><label>&nbsp;</label><button class="btn small" id="st-review-toggle">'+(stuFilters.reviewOnly ? 'Showing: needs review' : 'Show all')+'</button></div>';

    var list = STATE.roster.filter(function(s){
      if(stuFilters.q && s.name.toLowerCase().indexOf(stuFilters.q.toLowerCase())===-1) return false;
      if(stuFilters.centre && s.centre!==stuFilters.centre) return false;
      if(stuFilters.teacher && s.teacher!==stuFilters.teacher) return false;
      if(stuFilters.std && s.std!==stuFilters.std) return false;
      if(stuFilters.reviewOnly && !s.needs_review) return false;
      return true;
    });

      var ck = classSortKey(a.std)-classSortKey(b.std);
      return ck!==0 ? ck : a.name.localeCompare(b.name);
    });

    html += '<div class="controls-row" style="justify-content:space-between;"><span class="stat-pill">'+list.length+' students</span></div>';

    html += '<div class="table-scroll"><table><thead><tr>';
    ['Name','Centre','Teacher','Std','Attendance',''].forEach(function(h){ html += '<th>'+h+'</th>'; });
    html += '</tr></thead><tbody id="st-tbody">';
    list.forEach(function(s){
      var stats = studentStats(s.id);
      var pctTxt = stats.pct===null ? '—' : stats.pct+'%';
      html += '<tr data-sid="'+s.id+'">';
      html += '<td class="name-cell">'+esc(s.name)+(s.needs_review?' <span class="chip review">Review</span>':'')+'</td>';
      html += '<td>'+esc(shortCentre(s.centre))+'</td>';
      html += '<td>'+(s.teacher?esc(s.teacher):'<em style="color:var(--accent-soft-ink);">unassigned</em>')+'</td>';

        EDIT_FIELDS.forEach(function(pair){
          var key=pair[0], label=pair[1];
          var val = s[key];
          var lblId = 'lbl-'+s.id+'-'+key;
          html += '<div class="detail-item"><label id="'+lblId+'">'+label+'</label>';
          html += '<span class="editable'+(val?'':' missing')+'" contenteditable="true" role="textbox" aria-multiline="false" aria-labelledby="'+lblId+'" data-field="'+key+'">'+esc(val || 'tap to add')+'</span></div>';

    newSearchEl.addEventListener('input', function(e){
      var v = e.target.value;
      clearTimeout(newSearchEl._debounce);
      newSearchEl._debounce = setTimeout(function(){ stuFilters.q = v; renderStudents(); }, 220);
    });
    var stCentreEl = document.getElementById('st-centre');
    if(stCentreEl){
      stCentreEl.addEventListener('change', function(e){ stuFilters.centre = e.target.value; stuFilters.std = ''; renderStudents(); });
    }
    document.getElementById('st-teacher').addEventListener('change', function(e){ stuFilters.teacher = e.target.value; renderStudents(); });
    document.getElementById('st-std').addEventListener('change', function(e){ stuFilters.std = e.target.value; renderStudents(); });
    document.getElementById('st-review-toggle').addEventListener('click', function(){ stuFilters.reviewOnly = !stuFilters.reviewOnly; renderStudents(); });
    el.querySelectorAll('[data-expand]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-expand');
        stuFilters.expanded = (stuFilters.expanded===id) ? null : id;
        renderStudents();
      });
    });
    el.querySelectorAll('.editable').forEach(function(span){
      span.addEventListener('blur', async function(){
        var panel = span.closest('[data-detail]');
        var sid = panel.getAttribute('data-detail');
        var field = span.getAttribute('data-field');
        var val = span.textContent.trim();
        if(val==='tap to add') val='';
        var stu = studentsById()[sid];
        if(stu[field] !== val){
          var patch = {}; patch[field] = val || null;
          var check = validateField(field, val);
          if(field==='gender' || field==='age' || field==='medium' || field==='teacher'){
            var merged = Object.assign({}, stu, patch);
            patch.needs_review = !check.ok || !(merged.gender && merged.age && merged.medium && merged.teacher);
          } else if(!check.ok){
            patch.needs_review = true;
          }
          Object.assign(stu, patch);
          var ok = await persistWrite({type:'update', col:'students', docId:sid, data:patch});
          if(!check.ok){ showToast(check.msg); }
          else { showToast(ok ? 'Saved.' : 'Saved on this device — will sync when back online.'); }
          if(!isEditingStudents()) renderStudents();
        }
      });
      span.addEventListener('keydown', function(e){
        if(e.key==='Enter'){ e.preventDefault(); span.blur(); }
      });
    });
  }

  function exportCSV(){
    var header = ['Name','Centre','Teacher','Std','Gender','Age','Medium','Contact','Funding Partner','Sessions Marked','Sessions Present','Attendance %','Needs Review'];
    var lines = [header.join(',')];
    STATE.roster.forEach(function(s){
      var st = studentStats(s.id);
      var row = [s.name, s.centre, s.teacher||'', s.std||'', s.gender||'', s.age||'', s.medium||'', s.contact||'', s.funding_partner||'',
        st.total, st.present, st.pct===null?'':st.pct, s.needs_review?'Yes':'No'];
      lines.push(row.map(function(v){
        var str = String(v===null||v===undefined?'':v);
        if(str.indexOf(',')>-1 || str.indexOf('"')>-1){ str = '"'+str.replace(/"/g,'""')+'"'; }
        return str;
      }).join(','));
    });
    var csv = lines.join('\n');
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'akshar-paaul-attendance.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    showToast('CSV downloaded.');
  }

    if(LOAD_FAILED){
      el.innerHTML = '<div class="gate-card"><h1>Couldn\'t connect</h1>'
        + '<p class="lead">This needs an internet connection to sign in.</p>'
        + '<p class="gate-note">Check your connection and try again. If it keeps happening, ask your coordinator to check the internet filter/firewall isn\'t blocking <code>gstatic.com</code>.</p>'
        + '<button class="btn primary" id="retry-load-btn" style="margin-top:8px;">Try again</button></div>';
      document.getElementById('retry-load-btn').addEventListener('click', function(){ boot(); });
      return;
    }
    el.innerHTML =
      '<div class="gate-card">'
      + '<h1>Sign in to Akshar Paaul</h1>'
      + '<p class="lead">Use the login ID and password your coordinator gave you.</p>'
      + '<form class="gate-form" id="login-form">'
      + '<div class="field"><label>Login ID</label><input type="text" id="li-id" autocomplete="username" autocapitalize="off" placeholder="e.g. aruna"></div>'
      + '<div class="field"><label>Password</label><input type="password" id="li-pass" autocomplete="current-password"></div>'
      + '<div id="li-error" style="display:none;color:var(--absent);font-size:.82rem;"></div>'
      + '<button class="btn primary" type="submit" id="li-submit">Log in</button>'
      + '</form>'
      + '<p class="gate-note">Don\'t have a login yet, or forgot your password? Ask your coordinator — they can set one up or reset it for you in a minute, right from the Firebase console.</p>'
      + '</div>';

    document.getElementById('login-form').addEventListener('submit', function(e){
      e.preventDefault();
      var raw = document.getElementById('li-id').value.trim().toLowerCase();
      if(!raw) return;
      var email = raw.indexOf('@')===-1 ? raw+LOGIN_DOMAIN : raw;
      var pass = document.getElementById('li-pass').value;
      var submitBtn = document.getElementById('li-submit');
      var errEl = document.getElementById('li-error');
      errEl.style.display = 'none';
      submitBtn.disabled = true; submitBtn.textContent = 'Signing in…';
      signInWithEmailAndPassword(auth, email, pass).catch(function(err){
        errEl.textContent = friendlyAuthError(err);
        errEl.style.display = 'block';
        submitBtn.disabled = false; submitBtn.textContent = 'Log in';
      });
    });
  }

  function friendlyAuthError(err){
    var code = err && err.code;
    if(code==='auth/invalid-credential' || code==='auth/wrong-password' || code==='auth/user-not-found'){
      return 'That login ID or password isn\'t right. Double-check with your coordinator.';
    }
    if(code==='auth/too-many-requests'){ return 'Too many attempts — wait a bit and try again.'; }
    if(code==='auth/network-request-failed'){ return 'No internet connection — try again once you\'re online.'; }
    if(code==='auth/invalid-email'){ return 'That doesn\'t look like a valid login ID.'; }
    return 'Could not sign in. Please try again.';
  }

  function renderSignedInBar(){
    var el = document.getElementById('signedin-bar');
    if(!IDENTITY){ el.innerHTML=''; return; }
    var who = IDENTITY.role==='coordinator' ? 'Coordinator (all centres)' : (IDENTITY.name+' · '+shortCentre(IDENTITY.centre));
    el.innerHTML = 'Logged in as <b>'+esc(who)+'</b><button class="link-btn" id="logout-btn" style="margin-left:auto;">Log out</button>';
    document.getElementById('logout-btn').addEventListener('click', function(){ signOut(auth); });
  }

  function showApp(){
    document.getElementById('gate-screen').setAttribute('hidden','');
    document.getElementById('app-shell').removeAttribute('hidden');
    renderSignedInBar();
    updateSyncBanner();
    renderHeader(); renderMark(); renderStudents(); renderReports();
  }
  function showGate(){
    document.getElementById('app-shell').setAttribute('hidden','');
    document.getElementById('gate-screen').removeAttribute('hidden');
    renderGate();
  }

  // ================= OFFLINE QUEUE =================
  // Every write in this app goes through persistWrite(). It tries the real
  // Firestore write immediately; if that fails (no signal, dropped connection,
  // mid-save network hiccup) the write is queued in localStorage instead of
  // just failing, and retried automatically once the device is back online —
  // so marking attendance in a spot with patchy internet doesn't lose work.
  function loadPendingQueue(){
    try{ return JSON.parse(localStorage.getItem('ap_pending_writes') || '[]'); }
    catch(e){ return []; }
  }
  function savePendingQueue(){
    try{ localStorage.setItem('ap_pending_writes', JSON.stringify(PENDING_QUEUE)); }catch(e){}
  }
  function queueWrite(item){
    PENDING_QUEUE.push(item);
    savePendingQueue();
    updateSyncBanner();
  }
  async function execWrite(item){
    var ref = doc(db, item.col, item.docId);
    if(item.type==='set') await setDoc(ref, item.data);
    else if(item.type==='update') await updateDoc(ref, item.data);
    else if(item.type==='delete') await deleteDoc(ref);
  }
  // Applies the write immediately if possible; otherwise queues it for later
  // and returns false so the caller knows to tell the person it's pending.
  async function persistWrite(item){
    try{
      if(!navigator.onLine) throw new Error('offline');
      await execWrite(item);
      return true;
    }catch(e){
      queueWrite(item);
      return false;
    }
  }
  async function flushPendingQueue(){
    if(!PENDING_QUEUE.length || !navigator.onLine) return;
    var items = PENDING_QUEUE.slice();
    var stillPending = [];
    var synced = 0;
    for(var i=0;i<items.length;i++){
      try{ await execWrite(items[i]); synced++; }
      catch(e){ stillPending.push(items[i]); }
    }
    PENDING_QUEUE = stillPending;
    savePendingQueue();
    updateSyncBanner();
    if(synced>0) showToast(synced+' change'+(synced>1?'s':'')+' synced.');
  }
  function updateSyncBanner(){
    var el = document.getElementById('sync-banner');
    if(!el) return;
    if(PENDING_QUEUE.length===0 && navigator.onLine){
      el.setAttribute('hidden','');
      return;
    }
    el.removeAttribute('hidden');
    if(!navigator.onLine){
      el.innerHTML = '<span>You\'re offline. '+(PENDING_QUEUE.length ? PENDING_QUEUE.length+' change'+(PENDING_QUEUE.length>1?'s':'')+' will sync automatically once you\'re back online.' : 'Changes will be saved and synced once you\'re back online.')+'</span>';
    } else {
      el.innerHTML = '<span>'+PENDING_QUEUE.length+' change'+(PENDING_QUEUE.length>1?'s':'')+' not yet synced.</span><button class="btn ghost small" id="sync-retry-btn">Retry now</button>';
      var retryBtn = document.getElementById('sync-retry-btn');
      if(retryBtn) retryBtn.addEventListener('click', flushPendingQueue);
    }
  }
  window.addEventListener('online', flushPendingQueue);
  window.addEventListener('offline', updateSyncBanner);
  setInterval(function(){ if(navigator.onLine) flushPendingQueue(); }, 30000);

  // ================= FIRESTORE DATA LAYER =================
  // NOTE: the one-time bulk-import (batchWriteAll/runFullSeed) has been
  // moved out of this shipped file — see local_seed_tool_DO_NOT_UPLOAD.html.
  // By the time this file is live, the database is already seeded, so this
  // build only ever reads/writes existing teachers/students/attendance docs.

  async function loadProfileAndEnter(user){
    try{
      var profileRef = doc(db,'teachers', user.email);
      var snap = await getDoc(profileRef);
      if(snap.exists()){
        var profile = snap.data();
        IDENTITY = {uid:user.uid, email:user.email, name:profile.name, centre:profile.centre||null, role:profile.role};
        await afterLogin();
        return;
      }
      showToast('Your account isn\'t set up yet — ask your coordinator to add you.');
      await signOut(auth);
    }catch(err){
      showToast('Could not sign you in — check your connection and try again.');
      try{ await signOut(auth); }catch(e2){}
    }
  }

  function loadStudents(){
    return new Promise(function(resolve){
      var col = collection(db, 'students');
      var q = (IDENTITY.role==='teacher' && IDENTITY.centre) ? query(col, where('centre','==', IDENTITY.centre)) : col;
      if(studentsUnsub) studentsUnsub();
      var first = true;
      studentsUnsub = onSnapshot(q, function(snap){
        STATE.roster = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        if(first){ first=false; resolve(); }
        else if(!isEditingStudents()){
          renderHeader(); renderMark(); renderStudents(); renderReports();
        }
      }, function(err){ showToast('Could not load the roster — check your connection.'); resolve(); });
    });
  }

  async function loadAttendanceHistory(force){
    if(ATTENDANCE_HISTORY_LOADED && !force) return;
    try{
      var col = collection(db, 'attendance');
      var q = (IDENTITY.role==='teacher' && IDENTITY.centre) ? query(col, where('centre','==', IDENTITY.centre)) : col;
      var snap = await getDocs(q);
      snap.forEach(function(docSnap){ mergeAttendanceDoc(docSnap.data()); });
      ATTENDANCE_HISTORY_LOADED = true;
      renderStudents(); renderReports();
    }catch(e){ showToast('Could not load attendance history — check your connection.'); }
  }

  async function afterLogin(){
    await loadStudents();
    resubscribeMark();
    showApp();
    loadAttendanceHistory(false);
  }

  // ================= BOOT =================
  async function boot(){
    if(NEEDS_SETUP){ showGate(); return; }
    LOAD_FAILED = false;
    document.getElementById('gate-screen').innerHTML = '<div class="gate-card"><h1>Loading…</h1></div>';
    document.getElementById('gate-screen').removeAttribute('hidden');
    document.getElementById('app-shell').setAttribute('hidden','');
    var base = "https://www.gstatic.com/firebasejs/" + FIREBASE_SDK_VERSION + "/";
    var appMod, authMod, fsMod;
    try{
      var mods = await Promise.all([
        import(base + "firebase-app.js"),
        import(base + "firebase-auth.js"),
        import(base + "firebase-firestore.js")
      ]);
      appMod = mods[0]; authMod = mods[1]; fsMod = mods[2];
    }catch(e){
      LOAD_FAILED = true;
      renderGate();
      return;
    }
    initializeApp = appMod.initializeApp;
    getAuth = authMod.getAuth; setPersistence = authMod.setPersistence;
    browserLocalPersistence = authMod.browserLocalPersistence; onAuthStateChanged = authMod.onAuthStateChanged;
    signInWithEmailAndPassword = authMod.signInWithEmailAndPassword; signOut = authMod.signOut;
    getFirestore = fsMod.getFirestore; doc = fsMod.doc; getDoc = fsMod.getDoc; setDoc = fsMod.setDoc;
    updateDoc = fsMod.updateDoc; deleteDoc = fsMod.deleteDoc; collection = fsMod.collection;
    getDocs = fsMod.getDocs; onSnapshot = fsMod.onSnapshot; writeBatch = fsMod.writeBatch;
    query = fsMod.query; where = fsMod.where; limit = fsMod.limit;

    app = initializeApp(FIREBASE_CONFIG);
    auth = getAuth(app);
    db = getFirestore(app);
    try{ await setPersistence(auth, browserLocalPersistence); }catch(e){}
    showGate(); // Firebase is ready — onAuthStateChanged below will immediately
                // swap this for the app if a session is already remembered

    onAuthStateChanged(auth, function(user){
      if(user){
        loadProfileAndEnter(user);
      } else {
        if(studentsUnsub){ studentsUnsub(); studentsUnsub = null; }
        if(markUnsub){ markUnsub(); markUnsub = null; }
        STATE = { roster: [], attendance: {} };
        ATTENDANCE_HISTORY_LOADED = false;
        IDENTITY = null;
        showGate();
      }
    });
  }

  boot();
  </script>
</body>
